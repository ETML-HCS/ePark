<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 840" width="420" height="840">
  <defs>
    <!-- Screen Background Gradient -->
    <linearGradient id="mobileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Phone Chassis Bezel Gradient -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="50%" stop-color="#1A202C" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <!-- Emerald Button Gradient -->
    <linearGradient id="mobileBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Brand Logo Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="phoneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Ambient Glow -->
    <filter id="ambientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" result="blur" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
  </style>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#070A12" />

  <!-- Ambient Light Halo -->
  <circle cx="210" cy="420" r="160" fill="#10B981" opacity="0.1" filter="url(#ambientGlow)" />
  <circle cx="210" cy="200" r="140" fill="#4F46E5" opacity="0.1" filter="url(#ambientGlow)" />

  <!-- PHONE DEVICE CONTAINER -->
  <g transform="translate(18, 16)" filter="url(#phoneShadow)">
    <!-- Outer Titanium Rim -->
    <rect width="384" height="808" rx="46" fill="url(#chassisGrad)" stroke="#374151" stroke-width="2" />
    <rect x="3" y="3" width="378" height="802" rx="43" fill="#000000" />

    <!-- DISPLAY SCREEN (364 x 788) -->
    <g transform="translate(10, 10)">
      <clipPath id="screenClip">
        <rect width="364" height="788" rx="36" />
      </clipPath>

      <g clip-path="url(#screenClip)">
        <!-- Screen Wallpaper -->
        <rect width="364" height="788" fill="url(#mobileBg)" />

        <!-- Status Bar -->
        <g transform="translate(24, 14)">
          <text x="0" y="12" fill="#FFFFFF" font-size="12" font-weight="700" class="font-sans">09:41</text>
          
          <!-- Wi-Fi, 5G, Battery -->
          <g transform="translate(268, 2)">
            <!-- 5G Bars -->
            <rect x="0" y="7" width="2.5" height="4" rx="0.8" fill="#FFFFFF" />
            <rect x="4" y="5" width="2.5" height="6" rx="0.8" fill="#FFFFFF" />
            <rect x="8" y="3" width="2.5" height="8" rx="0.8" fill="#FFFFFF" />
            <rect x="12" y="1" width="2.5" height="10" rx="0.8" fill="#FFFFFF" />

            <!-- Battery -->
            <rect x="22" y="1" width="20" height="10" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.2" />
            <rect x="24" y="3" width="14" height="6" rx="1.5" fill="#10B981" />
            <path d="M43 4 C43.5 4 44 4.5 44 5 L44 7 C44 7.5 43.5 8 43 8 Z" fill="#FFFFFF" />
          </g>
        </g>

        <!-- Dynamic Island Notch -->
        <rect x="134" y="10" width="96" height="26" rx="13" fill="#000000" />
        <circle cx="150" cy="23" r="4.5" fill="#0F172A" />
        <circle cx="150" cy="23" r="2.5" fill="#1E293B" />
        <circle cx="210" cy="23" r="3.5" fill="#047857" />

        <!-- APP HEADER -->
        <g transform="translate(18, 52)">
          <!-- App Logo -->
          <rect width="30" height="30" rx="8" fill="url(#logoGrad)" />
          <path d="M10 8H16C18.2 8 20 9.8 20 12C20 14.2 18.2 16 16 16H13V21H10V8ZM13 10.5V13.5H16C17.1 13.5 17.8 12.8 17.8 12C17.8 11.2 17.1 10.5 16 10.5H13Z" fill="#FFFFFF" />
          <text x="38" y="21" fill="#FFFFFF" font-size="18" font-weight="900" class="font-sans">ePark</text>

          <!-- Express Key Status Pill -->
          <g transform="translate(200, 2)">
            <rect width="128" height="26" rx="13" fill="#065F46" stroke="#10B981" stroke-width="0.8" />
            <text x="12" y="17" fill="#34D399" font-size="10" font-weight="800" class="font-sans">🔑 Clé Active</text>
            <circle cx="114" cy="13" r="3" fill="#34D399" />
          </g>
        </g>

        <!-- Pre-Authenticated Subscriber Banner -->
        <g transform="translate(18, 96)">
          <rect width="328" height="48" rx="12" fill="#111827" stroke="#1F2937" stroke-width="1" />
          <text x="14" y="20" fill="#FFFFFF" font-size="12" font-weight="800" class="font-sans">Bonjour Alexandre 👋</text>
          <text x="14" y="36" fill="#9CA3AF" font-size="10" class="font-sans">Accès direct 1 clic • Débit auto configuré</text>
          <text x="290" y="28" fill="#10B981" font-size="14">⚡</text>
        </g>

        <!-- 1. DATE ULTRA-RAPIDE CHIPS -->
        <g transform="translate(18, 156)">
          <text x="0" y="10" fill="#9CA3AF" font-size="9" font-weight="800" class="font-sans">CHOISIR LE JOUR</text>
          <g transform="translate(0, 18)">
            <!-- Aujourd'hui (Active) -->
            <rect width="102" height="42" rx="10" fill="#4F46E5" stroke="#818CF8" stroke-width="1.2" />
            <text x="10" y="16" fill="#C7D2FE" font-size="8" font-weight="800" class="font-sans">⚡ PRIORITÉ</text>
            <text x="10" y="32" fill="#FFFFFF" font-size="11" font-weight="800" class="font-sans">Aujourd'hui</text>

            <!-- Demain -->
            <g transform="translate(112, 0)">
              <rect width="102" height="42" rx="10" fill="#111827" stroke="#1F2937" stroke-width="1" />
              <text x="10" y="16" fill="#6B7280" font-size="8" font-weight="800" class="font-sans">DEMAIN</text>
              <text x="10" y="32" fill="#D1D5DB" font-size="11" font-weight="700" class="font-sans">Mardi 20</text>
            </g>

            <!-- Dans 2j -->
            <g transform="translate(224, 0)">
              <rect width="104" height="42" rx="10" fill="#111827" stroke="#1F2937" stroke-width="1" />
              <text x="10" y="16" fill="#6B7280" font-size="8" font-weight="800" class="font-sans">DANS 2J</text>
              <text x="10" y="32" fill="#D1D5DB" font-size="11" font-weight="700" class="font-sans">Mercredi 21</text>
            </g>
          </g>
        </g>

        <!-- 2. MOMENT DE LA JOURNÉE -->
        <g transform="translate(18, 230)">
          <text x="0" y="10" fill="#9CA3AF" font-size="9" font-weight="800" class="font-sans">MOMENT DE LA JOURNÉE</text>
          <g transform="translate(0, 18)">
            <!-- Matin -->
            <rect width="78" height="42" rx="10" fill="#111827" stroke="#1F2937" stroke-width="1" />
            <text x="8" y="18" fill="#F9FAFB" font-size="10" font-weight="800" class="font-sans">🌅 Matin</text>
            <text x="8" y="32" fill="#9CA3AF" font-size="8" class="font-mono">8h-12h</text>

            <!-- Après-midi (Active) -->
            <g transform="translate(84, 0)">
              <rect width="78" height="42" rx="10" fill="#4F46E5" stroke="#818CF8" stroke-width="1.2" />
              <text x="8" y="18" fill="#FFFFFF" font-size="10" font-weight="800" class="font-sans">☀️ Aprem</text>
              <text x="8" y="32" fill="#C7D2FE" font-size="8" class="font-mono">12h-17h30</text>
            </g>

            <!-- Soir -->
            <g transform="translate(168, 0)">
              <rect width="78" height="42" rx="10" fill="#111827" stroke="#1F2937" stroke-width="1" />
              <text x="8" y="18" fill="#F9FAFB" font-size="10" font-weight="800" class="font-sans">🌙 Soir</text>
              <text x="8" y="32" fill="#9CA3AF" font-size="8" class="font-mono">18h-24h</text>
            </g>

            <!-- Nuit -->
            <g transform="translate(252, 0)">
              <rect width="76" height="42" rx="10" fill="#111827" stroke="#1F2937" stroke-width="1" />
              <text x="8" y="18" fill="#F9FAFB" font-size="10" font-weight="800" class="font-sans">🌌 Nuit</text>
              <text x="8" y="32" fill="#9CA3AF" font-size="8" class="font-mono">00h-07h</text>
            </g>
          </g>
        </g>

        <!-- 3. PLACE SÉLECTIONNÉE -->
        <g transform="translate(18, 304)">
          <rect width="328" height="60" rx="12" fill="#064E3B" fill-opacity="0.35" stroke="#10B981" stroke-width="1.5" />
          <text x="14" y="24" fill="#FFFFFF" font-size="13" font-weight="900" class="font-sans">Place A01 — Gare Centrale</text>
          <text x="14" y="42" fill="#34D399" font-size="11" font-weight="800" class="font-mono">CHF 3.00 / heure • 5.5 heures</text>
          <circle cx="302" cy="30" r="10" fill="#10B981" />
          <text x="298" y="34" fill="#FFFFFF" font-size="12">✓</text>
        </g>

        <!-- 4. BIG 1-CLICK ACTION BUTTON -->
        <g transform="translate(18, 376)">
          <rect width="328" height="52" rx="14" fill="url(#mobileBtnGrad)" />
          <text x="36" y="31" fill="#FFFFFF" font-size="13" font-weight="900" class="font-sans">⚡ RÉSERVER &amp; PAYER EN 1 CLIC</text>
          <text x="294" y="32" fill="#FFFFFF" font-size="16">→</text>
          <text x="120" y="46" fill="#D1FAE5" font-size="9" class="font-sans">Total : CHF 16.50 (Débit auto)</text>
        </g>

        <!-- 5. ACTIVE RESERVATION PASS CARD (Real-Time GPS + QR) -->
        <g transform="translate(18, 442)">
          <rect width="328" height="248" rx="14" fill="#111827" stroke="#10B981" stroke-width="1.2" />

          <!-- Header -->
          <g transform="translate(14, 16)">
            <rect width="70" height="20" rx="6" fill="#065F46" />
            <text x="8" y="14" fill="#34D399" font-size="8" font-weight="800" class="font-sans">● EN COURS</text>

            <text x="0" y="42" fill="#FFFFFF" font-size="14" font-weight="900" class="font-sans">Place A01 — Gare Centrale</text>
            <text x="0" y="58" fill="#9CA3AF" font-size="10" class="font-sans">Av. de la Gare 14, Lausanne</text>

            <!-- QR Code on right -->
            <g transform="translate(220, 0)">
              <rect width="78" height="78" rx="8" fill="#FFFFFF" />
              <!-- QR Patterns -->
              <rect x="8" y="8" width="18" height="18" fill="#0B0F19" />
              <rect x="11" y="11" width="12" height="12" fill="#FFFFFF" />
              <rect x="14" y="14" width="6" height="6" fill="#0B0F19" />

              <rect x="52" y="8" width="18" height="18" fill="#0B0F19" />
              <rect x="55" y="11" width="12" height="12" fill="#FFFFFF" />
              <rect x="58" y="14" width="6" height="6" fill="#0B0F19" />

              <rect x="8" y="52" width="18" height="18" fill="#0B0F19" />
              <rect x="11" y="55" width="12" height="12" fill="#FFFFFF" />
              <rect x="14" y="58" width="6" height="6" fill="#0B0F19" />

              <rect x="36" y="14" width="6" height="14" fill="#0B0F19" />
              <rect x="36" y="38" width="12" height="6" fill="#0B0F19" />
              <rect x="54" y="54" width="14" height="14" fill="#0B0F19" />
            </g>
          </g>

          <!-- Divider -->
          <line x1="14" y1="104" x2="314" y2="104" stroke="#1F2937" stroke-dasharray="3 3" />

          <!-- Details Grid -->
          <g transform="translate(14, 120)">
            <text x="0" y="12" fill="#6B7280" font-size="9" font-weight="800" class="font-sans">CRÉNEAU</text>
            <text x="0" y="28" fill="#FFFFFF" font-size="11" font-weight="700" class="font-mono">12:00 - 17:30</text>

            <text x="120" y="12" fill="#6B7280" font-size="9" font-weight="800" class="font-sans">VÉHICULE</text>
            <text x="120" y="28" fill="#FFFFFF" font-size="11" font-weight="800" class="font-mono">VD 123 456</text>

            <text x="210" y="12" fill="#6B7280" font-size="9" font-weight="800" class="font-sans">STATUT</text>
            <text x="210" y="28" fill="#34D399" font-size="10" font-weight="800" class="font-sans">✓ Payé auto</text>
          </g>

          <!-- GPS Button Inside Pass -->
          <g transform="translate(14, 184)">
            <rect width="300" height="42" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
            <text x="84" y="26" fill="#38BDF8" font-size="12" font-weight="800" class="font-sans">🗺️ Ouvrir GPS / Waze</text>
          </g>
        </g>

        <!-- Bottom Navigation Bar & Home Indicator -->
        <g transform="translate(0, 712)">
          <!-- Glass Bar Background -->
          <rect width="364" height="76" fill="#0B0F19" fill-opacity="0.9" stroke="#1F2937" stroke-width="0.5" />

          <!-- Nav Items -->
          <g transform="translate(42, 12)">
            <!-- Express Tab (Active) -->
            <circle cx="20" cy="12" r="14" fill="#065F46" />
            <text x="14" y="17" fill="#34D399" font-size="14">⚡</text>
            <text x="3" y="36" fill="#34D399" font-size="9" font-weight="800" class="font-sans">Express</text>

            <!-- Dashboard -->
            <g transform="translate(94, 0)">
              <text x="8" y="17" fill="#9CA3AF" font-size="14">📊</text>
              <text x="-4" y="36" fill="#9CA3AF" font-size="9" font-weight="600" class="font-sans">Cockpit</text>
            </g>

            <!-- Places -->
            <g transform="translate(188, 0)">
              <text x="8" y="17" fill="#9CA3AF" font-size="14">🚗</text>
              <text x="0" y="36" fill="#9CA3AF" font-size="9" font-weight="600" class="font-sans">Places</text>
            </g>

            <!-- Profil -->
            <g transform="translate(270, 0)">
              <text x="8" y="17" fill="#9CA3AF" font-size="14">🔑</text>
              <text x="2" y="36" fill="#9CA3AF" font-size="9" font-weight="600" class="font-sans">Clé</text>
            </g>
          </g>

          <!-- Home Indicator Bar -->
          <rect x="114" y="62" width="136" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.4" />
        </g>
      </g>
    </g>
  </g>
</svg>
